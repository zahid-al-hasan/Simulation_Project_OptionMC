[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "optionmc"
version = "0.1.0"
description = "Monte Carlo European option pricing with variance reduction techniques"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
report = ["Markdown>=3.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
